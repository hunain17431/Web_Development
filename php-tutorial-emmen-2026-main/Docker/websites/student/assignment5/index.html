<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Webinar Subscription</h2>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="name">
        <input type="text" id="surname" placeholder="surname"><br>
        

        <label for="mail">E-mail</label>
        <input type="email" placeholder="example@gmail.com" id="mail"><br>

        <label for="phone">Work Phone</label>
        <input type="text" id="areacode" placeholder="areacode">
        <input type="tel" id="phone"><br>

        <label for="company">Company</label>
        <input type="text" id="company" placeholder="company"><br>

        <label for="adress">Company Adress</label>
        <input type="text" id="adress"><br>
        <input type="text" id="adress2"><br>
        <input type="text" id="city">
        <input type="text" id="state"><br>
        <input type="text" id="postal"><br>
        
        <label for="website">Company Website</label>
        <input type="url" id="website"><br>

        <input type="submit" value="submit">
    </form>
</body>
</html>
